name: Update AkashGo Playlist

on:
  schedule:
    - cron: "*/20 * * * *"   # 20 minite run
  workflow_dispatch:

jobs:
  update_playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AkashGo playlist script
        run: |
          echo "=== Running AkashGo Playlist Generator ==="
          python app.py
          echo "=== Script Finished ==="
          ls -l
        env:
          AKASH_STATIC_TOKEN: ${{ secrets.AKASH_STATIC_TOKEN }}
          AKASH_SUBSCRIBER_ID: ${{ secrets.AKASH_SUBSCRIBER_ID }}
          FUCK_B: ${{ secrets.FUCK_B }}
          AKASH_API_URL: ${{ secrets.AKASH_API_URL }}
          AKASH_USERNAME: ${{ secrets.AKASH_USERNAME }}
          AKASH_APP_ID: ${{ secrets.AKASH_APP_ID }}
          AKASH_APP_KEY: ${{ secrets.AKASH_APP_KEY }}
          AKASH_DEVICE_TYPE: ${{ secrets.AKASH_DEVICE_TYPE }}
          AKASH_DEVICE_PLATFORM: ${{ secrets.AKASH_DEVICE_PLATFORM }}
          AKASH_USER_AGENT: ${{ secrets.AKASH_USER_AGENT }}
          AKASH_ORIGIN: ${{ secrets.AKASH_ORIGIN }}
          AKASH_REFERER: ${{ secrets.AKASH_REFERER }}
          AKASH_SUBSCRIPTION_TYPE: ${{ secrets.AKASH_SUBSCRIPTION_TYPE }}
          AKASH_DTH_STATUS: ${{ secrets.AKASH_DTH_STATUS }}

      - name: Commit updated playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update playlist ($(date '+%Y-%m-%d %H:%M:%S'))"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
